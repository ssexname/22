name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 서버 전체에 화면 띄우기 금지 (KSP 버그 차단)
env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 가짜 인증서 생성
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug" || true

      - name: Gradle 환경 구성
        uses: gradle/actions/setup-gradle@v3

      - name: APK 빌드 (캐시 삭제 및 리포트 강제 생성)
        id: build_step
        # 꼬여있는 캐시를 끄고(--no-configuration-cache), 초기화(clean) 후 빌드합니다.
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-configuration-cache --stacktrace
        continue-on-error: true # ★핵심: 여기서 에러가 나도 강제로 다음 단계로 넘김★

      - name: 🚨 [실패 시] 에러 보고서 다운로드 생성
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-reports
          path: |
            app/build/reports/
            build/reports/

      - name: 🎁 [성공 시] APK 파일 다운로드 생성
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: 최종 결과 판정
        if: steps.build_step.outcome != 'success'
        run: exit 1
