name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# KSP 화면(UI) 충돌 튕김 버그 강제 차단
env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 환경변수 및 가짜 인증서 강제 생성
        run: |
          # 서버 주소 에러 방지
          touch .env.example && touch .env
          echo "SERVER_URL=http://localhost:3000" > .env
          echo "SERVER_URL=http://localhost:3000" > .env.example
          
          # 인증서(Keystore) 에러 방지용 가짜 도장 생성
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug" || true

      - name: Gradle 환경 구성
        uses: gradle/actions/setup-gradle@v3

      - name: APK 빌드 (모든 에러 덮어쓰기)
        run: |
          # 0초 만에 튕기는 현상 방지: 실행 파일(gradlew) 자동 생성
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          
          # 캐시 무시하고, 가짜 인증서로 덮어씌워서 강제 빌드
          ./gradlew assembleDebug --no-daemon -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android --stacktrace

      - name: 🎁 생성된 APK 파일 다운로드 생성
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
